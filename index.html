<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota de Atualização</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Quicksand:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
            background: transparent;
        }

        /* OVERLAY para clique fora */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            cursor: pointer;
        }

        /* POPUP CENTRALIZADO */
        .popup-container {
            background: rgba(10, 20, 30, 0.3);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(135, 207, 235, 0.3);
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            position: relative;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5), 0 0 30px rgba(135, 207, 235, 0.2);
            animation: dreamAppear 0.8s ease;
            margin: auto;
            cursor: default;
            pointer-events: auto;
        }

        @keyframes dreamAppear {
            0% {
                transform: scale(0.7) translateY(30px);
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
                filter: blur(0);
            }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            background: none;
            border: none;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 10001;
        }

        .close-btn:hover {
            background: rgba(135, 207, 235, 0.2);
            color: #87ceeb;
            transform: rotate(90deg);
        }

        .popup-content {
            text-align: center;
            color: white;
        }

        .popup-content h2 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2.2em;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(135, 207, 235, 0.5);
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff, #87ceeb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .version-badge {
            display: inline-block;
            background: rgba(135, 207, 235, 0.2);
            border: 1px solid #87ceeb;
            border-radius: 50px;
            padding: 5px 15px;
            margin: 5px 0 10px;
            font-size: 0.9em;
            letter-spacing: 1px;
            color: #87ceeb;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .update-icon {
            font-size: 40px;
            margin-bottom: 5px;
            display: inline-block;
            animation: dreamFloat 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(135, 207, 235, 0.5));
        }

        .update-icon::before {
            content: "🌟";
        }

        @keyframes dreamFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(5deg); }
            75% { transform: translateY(-3px) rotate(-5deg); }
        }

        .update-title {
            font-size: 1.3em;
            margin: 5px 0 10px;
            color: #fff;
            text-shadow: 0 0 15px rgba(135, 207, 235, 0.5);
        }

        .update-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
        }

        .update-category {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #87ceeb;
            border-radius: 10px;
            padding: 10px;
            text-align: left;
            backdrop-filter: blur(5px);
        }

        .update-category.feature-new {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .update-category h3 {
            color: #87ceeb;
            font-size: 1em;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .feature-new h3 {
            color: #ffd700;
        }

        .update-items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 10px;
        }

        .update-items span {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .update-items span:before {
            content: "✦";
            color: #ffd700;
            font-size: 0.9em;
            margin-right: 2px;
        }

        .update-footer {
            margin: 12px 0 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            border: 1px dashed #87ceeb;
        }

        .stars-decoration {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #ffd700;
            font-size: 16px;
            opacity: 0.6;
            animation: twinkle 2s infinite;
        }

        .stars-decoration.right {
            left: auto;
            right: 15px;
        }

        .stars-decoration::before {
            content: "✦ ✦ ✦";
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .particles-popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 30px;
        }

        .particle {
            position: absolute;
            background: rgba(135, 207, 235, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 8s infinite linear;
        }

        @keyframes particleFloat {
            from { transform: translateY(100%) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            to { transform: translateY(-100%) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body style="background: transparent;">
    <!-- OVERLAY para clique fora -->
    <div class="popup-overlay" id="popupOverlay" onclick="fecharPopup()">
        <!-- POPUP CENTRALIZADO -->
        <div class="popup-container" onclick="event.stopPropagation()">
            <div class="stars-decoration"></div>
            <div class="stars-decoration right"></div>
            
            <div class="particles-popup" id="particlesPopup"></div>
            
            <button class="close-btn" onclick="fecharPopup()">&times;</button>
            
            <div class="popup-content">
                <div class="update-icon"></div>
                <h2>ATUALIZAÇÃO</h2>
                <div class="version-badge" id="versaoAtual">v1.0.0</div>
                
                <div class="update-title" id="tituloAtualizacao">
                    Título da Atualização
                </div>
                
                <div class="update-grid" id="updateGrid"></div>
                
                <div class="update-footer" id="footerAtualizacao">
                    ✦ Novidades disponíveis ✦
                </div>
            </div>
        </div>
    </div>

    <script>
        // DADOS DA ATUALIZAÇÃO - EDITAR AQUI
        const updateData = {
            versao: "1.0.0",
            titulo: "Nova Atualização",
            footer: "✦ Novidades disponíveis ✦",
            categorias: [
                {
                    titulo: "✨ NOVO",
                    itens: ["Modo Co-op", "Progressão", "Loja"],
                    destaque: true
                },
                {
                    titulo: "🎮 MELHORIAS",
                    itens: ["Performance", "Efeitos", "Interface"],
                    destaque: false
                },
                {
                    titulo: "🔧 CORREÇÕES",
                    itens: ["Bugs", "Áudio", "Fases"],
                    destaque: false
                }
            ]
        };

        // Elementos
        const updateGrid = document.getElementById('updateGrid');

        // Criar partículas
        function criarParticulas() {
            const container = document.getElementById('particlesPopup');
            if (!container) return;
            
            // Limpar partículas existentes
            container.innerHTML = '';
            
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = Math.random() * 10 + 5 + 's';
                particle.style.background = `rgba(135, 207, 235, ${Math.random() * 0.3})`;
                
                container.appendChild(particle);
            }
        }

        // Renderizar atualizações
        function renderizarAtualizacoes() {
            if (!updateGrid) return;
            
            let html = '';
            
            updateData.categorias.forEach(categoria => {
                html += `
                    <div class="update-category ${categoria.destaque ? 'feature-new' : ''}">
                        <h3>${categoria.titulo}</h3>
                        <div class="update-items">
                            ${categoria.itens.map(item => `<span>${item}</span>`).join('')}
                        </div>
                    </div>
                `;
            });
            
            updateGrid.innerHTML = html;
            
            document.getElementById('versaoAtual').textContent = `v${updateData.versao}`;
            document.getElementById('tituloAtualizacao').textContent = updateData.titulo;
            document.getElementById('footerAtualizacao').textContent = updateData.footer;
        }

        // Fechar popup
        function fecharPopup() {
            // Se estiver dentro de um iframe, tenta comunicar com o pai
            if (window.parent && window.parent !== window) {
                window.parent.postMessage('fecharPopup', '*');
            } else {
                // Se não estiver em iframe, apenas esconde (opcional)
                document.getElementById('popupOverlay').style.display = 'none';
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            criarParticulas();
            renderizarAtualizacoes();
        });

        // API para comunicação
        window.UpdatePopup = {
            setDados: function(novosDados) {
                Object.assign(updateData, novosDados);
                renderizarAtualizacoes();
            },
            fechar: fecharPopup
        };

        console.log('✨ Popup carregado! Clique fora para fechar.');
    </script>
</body>
</html>
